version: 2

project_name: academic-page

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: academic-page
    binary: academic-page
    main: .
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

# Signs the macOS binaries with the Developer ID certificate and notarizes
# them with Apple, from the Linux runner. Skipped when the secrets are not
# set, as in local snapshots.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [academic-page]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: academic-page
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

release:
  # Tags such as v0.2.0-rc.1 publish a prerelease.
  prerelease: auto

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: academic-page
    repository:
      owner: OnPequod
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    binaries: [academic-page]
    homepage: https://academic.page
    description: Manage an Academic.page site from the command line, or as an MCP server
    commit_author:
      name: academic-page-release
      email: noreply@academic.page
    commit_msg_template: "academic-page {{ .Tag }}"
    # Release candidates (v1.2.3-rc.1) do not update the tap.
    skip_upload: auto
